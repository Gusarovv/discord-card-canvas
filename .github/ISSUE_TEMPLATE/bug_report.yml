name: Bug Report
description: Report a bug or unexpected behavior
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: Package version
      placeholder: "2.1.1"
    validations:
      required: true

  - type: input
    id: node-version
    attributes:
      label: Node.js version
      placeholder: "20.11.0"
    validations:
      required: true

  - type: dropdown
    id: card-type
    attributes:
      label: Card type
      options:
        - RankCardBuilder
        - BaseCardBuilder
        - WelcomeBuilder
        - LeaveBuilder
        - InfoCardBuilder
        - Other / Not applicable
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the bug clearly.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: code
    attributes:
      label: Code to reproduce
      render: typescript
    validations:
      required: true
